 <div class="card"><h3>پشتیبان‌گیری</h3><div class="row"><button class="btn pri" data-a="exportData" data-id="0">⬇ بکاپ کامل (کارتکس‌ها + فاکتورها)</button><button class="btn" data-a="exportData" data-id="1">⬇ بکاپ کامل + عکس و ویدیو</button><label class="btn" style="margin:0;cursor:pointer">⬆ بازیابی از فایل<input type="file" accept=".json,application/json" hidden onchange="A.importFile(this.files[0])"></label></div><p class="mu" style="margin:12px 0 0;font-size:12px">هر بکاپ کامل در یک فایل شامل کارتکس‌ها، مشتریان، تأمین‌کنندگان، تعمیرکاران، انعام‌ها و <b>فاکتورهای فاکتورپلاس</b> است. نسخه «با عکس و ویدیو» حجمش بیشتر است. فایل‌های بکاپ قدیمی (ورکشاپ منیجر، فاکتورپلاس) هم بازیابی می‌شوند.</p></div>
<div class="card"><h3>نسخه‌های خودکار روزانه (۱۴ روز اخیر)</h3><div id="snaps" class="mu">…</div></div>${D?'<div class="card"><h3>📂 پوشه‌ها و بکاپ‌ها (ویندوز)</h3><div id="dpaths" class="mu" style="margin-bottom:12px">…</div><div class="row"><button class="btn" data-a="deskOpen" data-id="root">پوشه اصلی</button><button class="btn" data-a="deskOpen" data-id="backups">پوشه بکاپ‌ها</button><button class="btn" data-a="deskOpen" data-id="media">پوشه عکس و فیلم‌ها</button><button class="btn pri" data-a="deskBackupNow">💾 بکاپ همین حالا</button><button class="btn" data-a="deskChoose">تغییر محل پوشه اصلی</button></div><h3 style="margin-top:18px">آخرین بکاپ‌ها</h3><div id="bklist" class="mu">…</div></div>':''}<div class="card"><h3>فضای ذخیره‌سازی</h3><div id="stor" class="mu">…</div></div>`;
A.saveSet=()=>{const u0=S.set.unit;S.set.shop=val('shop')||'تعمیرگاه من';S.set.unit=val('unit')==='toman'?'toman':'rial';save();if(u0!==S.set.unit)fxSend({type:'unit',syncUnit:true});render();toast('ذخیره شد')};
const _r=render;render=function(){_r();if(route[0]==='settings')snapList();if(D&&route[0]==='settings')deskRefresh();if(route[0]==='settings'&&navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const el=$('#stor');if(el)el.textContent=`استفاده‌شده: ${(e.usage/1048576).toFixed(1)} مگابایت از ${(e.quota/1073741824).toFixed(1)} گیگابایت`})};
let askR=null,askMode='c',askDanger=false;
function ask(msg,ok='بله'){return new Promise(res=>{askR=res;askMode='c';askDanger=/حذف|پاک|جایگزین|لغو تسویه|بازگشت به این نسخه/.test(msg);SND[askDanger?'warn':'pop']();$('#dlg2').innerHTML=`<div class="box"><p style="font-size:15px;line-height:2;margin:0 0 16px;white-space:pre-line">${esc(msg)}</p><div class="row"><button id="askY" class="btn pri" data-a="askY">${ok} (Enter)</button><button class="btn" data-a="askN">انصراف (Esc)</button></div></div>`;$('#dlg2').classList.add('on');setTimeout(()=>{const y=$('#askY');y&&y.focus()},30)})}
function askText(msg,v0=''){return new Promise(res=>{askR=res;askMode='t';$('#dlg2').innerHTML=`<div class="box"><p style="font-size:15px;margin:0 0 12px">${esc(msg)}</p><input id="askI" value="${esc(v0)}"><div class="row" style="margin-top:14px"><button class="btn pri" data-a="askY">تأیید (Enter)</button><button class="btn" data-a="askN">انصراف (Esc)</button></div></div>`;$('#dlg2').classList.add('on');setTimeout(()=>{const i=$('#askI');i&&(i.focus(),i.select())},30)})}
function askEnd(v){$('#dlg2').classList.remove('on');if(v===true)SND[askDanger?'del':'ok']();else if(v===false)SND.tap();if(askR){const r=askR;askR=null;r(v===false&&askMode==='t'?null:v)}}
A.askY=()=>askEnd(askMode==='t'?$('#askI').value:true);A.askN=()=>askEnd(false);
/* ---- snapshots + unified backup/restore (workshop + FactorPlus invoices + media) ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function snapshot(){lastSnap=Date.now();const k='snap:'+new Date().toISOString().slice(0,10);await DB.set(k,JSON.stringify(S)).catch(()=>{});const ks=(await DB.keys()).filter(x=>String(x).startsWith('snap:')).sort();for(const x of ks.slice(0,-14))await DB.del(x)}
async function snapList(){const el=$('#snaps');if(!el)return;const ks=(await DB.keys()).filter(x=>String(x).startsWith('snap:')).sort().reverse();el.innerHTML=T(['روز','تاریخ میلادی',''],ks.map(k=>`<tr><td>${jd(k.slice(5))}</td><td dir="ltr" class="mu">${k.slice(5)}</td><td><button class="btn sm" data-a="snapRestore" data-id="${k}">بازگشت به این نسخه</button></td></tr>`),'هنوز نسخه‌ای ساخته نشده.')}
A.snapRestore=async k=>{const t=await DB.get(k);if(!t||!await ask('اطلاعات فعلی با نسخه '+k.slice(5)+' جایگزین شود؟\n(قبل از آن یک نسخه از وضعیت فعلی نگه داشته می‌شود)'))return;await DB.set('pre:restore',JSON.stringify(S));S=normalize(JSON.parse(t));await DB.set('state',S);render();toast('بازگشت انجام شد')};
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function fxEnsure(){fxInit();for(let i=0;i<40&&!fxReady;i++)await sleep(250)}
async function fullBackup(withMedia){await fxEnsure();const f=await fxBackupData();const o={app:'WorkshopPro',v:4,created:iso(),data:Object.assign({},S),factor:f};if(withMedia){o.mediaBlobs={};for(const m of S.media.filter(x=>!x.rel)){const b=await DB.get(m.id,'media');if(b)o.mediaBlobs[m.id]=await b64(b)}}return o}
async function restoreAll(o){const st=o.data||o.S||o.state||o,n=normalize(st);if(o.mediaBlobs)for(const id in o.mediaBlobs){const r=await fetch(o.mediaBlobs[id]);await DB.set(id,await r.blob(),'media')}S=n;await DB.set('state',S);if(o.factor&&Array.isArray(o.factor.saved)){await fxEnsure();fxSend({type:'restoreBackup',data:o.factor})}render()}
async function doBackup(withMedia,open){toast('در حال ساخت بکاپ…');const o=await fullBackup(withMedia),json=JSON.stringify(o),name=`workshop-full-${stamp()}${withMedia?'-with-media':''}.json`;if(D){await D.backup(name,json);if(open)D.openFolder('backups');toast('بکاپ کامل در پوشه بکاپ‌ها ذخیره شد');if(route[0]==='settings')deskRefresh();return}const bl=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;a.click();toast(o.factor?'بکاپ کامل (کارتکس‌ها + فاکتورها) دریافت شد':'بکاپ ورکشاپ دریافت شد؛ فاکتورپلاس آماده نبود')}
A.exportData=id=>doBackup(id==='1',true);A.deskBackupNow=()=>doBackup(false,false);
A.importText=async text=>{try{const o=JSON.parse(text);if(Array.isArray(o.saved)&&!o.cards&&!o.data){if(!await ask('این فایل فقط فاکتورهای فاکتورپلاس است ('+fa(o.saved.length)+' فاکتور). جایگزین فاکتورهای فعلی شود؟'))return;await fxEnsure();fxSend({type:'restoreBackup',data:o});toast('فاکتورها بازیابی شد');return}
 const st=o.data||o.S||o.state||o;if(!Array.isArray(st.cards))throw 0;const n=normalize(st);if(!await ask(`${fa(n.cards.length)} کارتکس و ${fa(n.customers.length)} مشتری${o.factor?' و '+fa((o.factor.saved||[]).length)+' فاکتور':''} در فایل است. جایگزین اطلاعات فعلی شود؟\n(قبل از آن یک نسخه از وضعیت فعلی نگه داشته می‌شود)`))return;await DB.set('pre:restore',JSON.stringify(S));await restoreAll(o);toast('بازیابی شد')}catch(e){toast('فایل پشتیبان معتبر نیست')}};
A.importFile=async f=>{if(f)A.importText(await f.text())};
A.deskRestore=async name=>A.importText(await D.readBackup(name));
/* ---- Windows-app helpers: quick folders, backups list, FactorPlus backup ---- */
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function deskRefresh(){const i=await D.info(),l=await D.listBackups(),a=$('#dpaths'),b=$('#bklist');if(!a||!b)return;
 a.innerHTML=`پوشه اصلی: <b dir="ltr">${esc(i.root)}</b><br>بکاپ‌ها: <b dir="ltr">${esc(i.backups)}</b><br>عکس و فیلم: <b dir="ltr">${esc(i.media)}</b><br><small>روی دسکتاپ هم میانبر «بکاپ ورکشاپ» و «عکس و فیلم کارتکس ها» ساخته شده است.</small>`;
 b.innerHTML=T(['فایل','تاریخ','حجم',''],l.slice(0,12).map(x=>`<tr><td dir="ltr" style="text-align:right">${esc(x.name)}</td><td>${new Date(x.mtime).toLocaleString('fa-IR')}</td><td>${kb(x.size)}</td><td><button class="btn sm" data-a="deskRestore" data-id="${esc(x.name)}">بازیابی</button></td></tr>`),'هنوز بکاپی ساخته نشده.')}
A.deskOpen=k=>D.openFolder(k);
A.deskCard=id=>{const c=card(id);if(!c.folder){c.folder=cardFolder(c);save()}D.openFolder('media',c.folder)};
A.deskChoose=async()=>{const r=await D.chooseRoot();if(r){toast('پوشه اصلی تغییر کرد (فایل‌های قبلی در محل قبلی می‌مانند)');deskRefresh()}};
let bkWait={};
addEventListener('message',e=>{if(e.data&&e.data.fp==='backup'){const w=bkWait[e.data.id];if(w){delete bkWait[e.data.id];w(e.data.data)}}});
const fxBackupData=()=>new Promise(res=>{if(!fxReady)return res(null);const id=uid();bkWait[id]=res;fxSend({type:'getBackup',id});setTimeout(()=>{if(bkWait[id]){delete bkWait[id];res(null)}},4000)});
async function deskFactorBackup(force){if(!force&&Date.now()-(+localStorage.getItem('lastFxBk')||0)<6*3600e3)return false;fxInit();for(let i=0;i<20&&!fxReady;i++)await new Promise(r=>setTimeout(r,500));const d=await fxBackupData();if(d&&d.saved&&d.saved.length){await D.backup('factorplus-'+stamp()+'.json',JSON.stringify(d));localStorage.setItem('lastFxBk',Date.now());return true}return false}
if(D){setTimeout(()=>{fxInit()},3500);setTimeout(()=>deskFactorBackup(false),30000);setInterval(()=>deskFactorBackup(false),30*60*1000);addEventListener('beforeunload',()=>{try{D.autoBackup(JSON.stringify({app:'WorkshopPro',v:3,data:Object.assign({},S,{media:S.media.filter(m=>m.rel)})}))}catch(e){}})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.id,t,e);if(e.target.id==='dlg')A.close();if(e.target.id==='dlg2')askEnd(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dlg2').classList.contains('on'))askEnd(false);else if($('#dlg').classList.contains('on'))A.close();else if(route[0]==='invoices')A.fxAsk()}if(e.key==='Enter'&&e.target.id==='askI'){e.preventDefault();askEnd($('#askI').value)}});addEventListener('hashchange',go);
(async()=>{let s=await DB.get('state');if(!s&&D){try{const t=await D.readState();if(t){const o=JSON.parse(t);s=o.data||o}}catch(e){}}if(!s){try{const old=JSON.parse(localStorage.getItem('wm_web_v3')||'null');if(old&&old.cards)s=old}catch(e){}}S=normalize(s);await DB.set('state',S).catch(()=>{});if(D&&D.getWinMode){winMode=await D.getWinMode();D.onWinMode&&D.onWinMode(m=>{winMode=m;render()})}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}go();snapshot()})();
</script></body></html>
